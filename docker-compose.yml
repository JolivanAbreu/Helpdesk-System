# Banco de dados para desenvolvimento local.
# Subir:  docker compose up -d
# Parar:  docker compose down        (os dados ficam no volume)
# Zerar:  docker compose down -v     (apaga o volume e todos os dados)

services:
  db:
    image: mariadb:10.11
    container_name: helpdesk_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_password_segura
      MARIADB_DATABASE: helpdesk_db
      MARIADB_USER: helpdesk_user
      MARIADB_PASSWORD: user_password_segura
      # Atualiza automaticamente dados criados por uma versão anterior (ex.: 10.5)
      MARIADB_AUTO_UPGRADE: "1"
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:
